name: Headless engine

on:
  push:
  pull_request:

jobs:
  portable:
    name: portable-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake --preset dev-headless
      - name: Build
        run: cmake --build --preset dev-headless
      - name: Test
        run: ctest --preset dev-headless
      - name: Install package
        run: cmake --install out/build/dev-headless --prefix out/install
      - name: Configure package consumer
        run: cmake -G Ninja -S tests/package_consumer -B out/consumer "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/install" -DCMAKE_BUILD_TYPE=Debug
      - name: Build package consumer
        run: cmake --build out/consumer

  clang-sanitizers:
    name: clang-sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Clang and Ninja
        run: sudo apt-get update && sudo apt-get install --yes clang ninja-build
      - name: Configure
        run: cmake --preset ci-sanitizers
      - name: Build
        run: cmake --build --preset ci-sanitizers
      - name: Test
        run: ctest --preset ci-sanitizers
      - name: Install package
        run: cmake --install out/build/ci-sanitizers --prefix out/install
      - name: Configure package consumer
        run: >-
          cmake -G Ninja -S tests/package_consumer -B out/consumer
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/install"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build package consumer
        run: cmake --build out/consumer
